<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semantic Gateway</title>
<link rel="stylesheet" href="/gateway.css">
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <symbol id="g-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="g-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4h4"/></symbol>
</svg>

<header class="bar">
  <div class="brand">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="8" cy="7" r="1.6" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="10" cy="17" r="1.6" fill="currentColor" stroke="none"/></svg>
    </span>
    <strong class="brand-name">Semantic Gateway</strong>
    <span class="status">
      <span class="dot" id="status-dot"></span>
      <span class="muted" id="status" role="status" aria-live="polite">connecting</span>
    </span>
  </div>
  <div class="bar-tools">
    <nav class="bar-group bar-actions">
      <button id="new-worker" class="primary has-icon">
        <svg class="ic" aria-hidden="true"><use href="#g-plus"/></svg><span>New worker</span>
      </button>
      <button id="refresh" class="has-icon">
        <svg class="ic" aria-hidden="true"><use href="#g-refresh"/></svg><span>Refresh</span>
      </button>
    </nav>
  </div>
</header>

<main>
  <section id="cards" class="cards" aria-label="Totals"></section>

  <section class="panel">
    <h2>Workers</h2>
    <table class="workers">
      <thead>
        <tr>
          <th>Project</th>
          <th>Project id</th>
          <th>Root path</th>
          <th>PID</th>
          <th>State</th>
          <th>Index</th>
          <th>Restarts</th>
          <th>Degraded</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="worker-rows"></tbody>
    </table>
  </section>

  <div id="health-panel" hidden></div>

  <section class="panel" id="worker-form" hidden>
    <h2 id="form-title">Worker</h2>
    <div id="form-fields"></div>
    <pre id="command-preview"></pre>
    <p class="error" id="form-errors"></p>
    <div class="form-actions">
      <button id="save-start" class="primary">Save &amp; Start</button>
      <button id="save-only">Save without starting</button>
    </div>
  </section>
</main>

<script src="/gateway.js"></script>
</body>
</html>
