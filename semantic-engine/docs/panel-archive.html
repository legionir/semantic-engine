<!--
  بایگانی رابط کاربری پنل VS Code — حذف‌شده در فاز ۱۱ (MIG-56).

  این HTML از `src/ui/SemanticEnginePanel.ts` بیرون کشیده شده و صرفاً
  برای مرجع نگه داشته می‌شود؛ در هیچ مسیر اجرایی بارگذاری نمی‌شود.

  دو نقصی که در ارزیابی ثبت شد و در هر داشبورد آینده باید رفع شود:

  - SE-UI-01 — دکمه‌ها `aiCoder.semanticEngineQuickScan` و
    `aiCoder.semanticEngineReindex` را صدا می‌زدند، درحالی‌که این پکیج
    `semanticEngine.scanWorkspace` و `semanticEngine.scanWithSymbols` را
    ثبت می‌کرد. هر دو دکمهٔ اصلی خطا می‌دادند.
  - SE-UI-02 — `enableScripts: true` بدون Content-Security-Policy، بدون
    nonce و بدون `localResourceRoots`؛ و `setConfig` هر کلید دلخواهی را
    بدون allowlist روی تنظیمات Global می‌نوشت.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semantic Engine</title>
  <style>
    body {
      font-family: var(--vscode-font-family);
      color: var(--vscode-foreground);
      background-color: var(--vscode-editor-background);
      padding: 20px;
      line-height: 1.5;
    }
    h1 { font-size: 1.5em; margin-bottom: 0.5em; }
    h2 { font-size: 1.2em; margin-top: 1.5em; margin-bottom: 0.5em; }
    button {
      background-color: var(--vscode-button-background);
      color: var(--vscode-button-foreground);
      border: none;
      padding: 8px 16px;
      margin: 4px 4px 4px 0;
      cursor: pointer;
      border-radius: 2px;
      font-size: 13px;
    }
    button:hover { background-color: var(--vscode-button-hoverBackground); }
    .section { margin-bottom: 20px; }
    .setting {
      display: flex;
      align-items: center;
      margin: 8px 0;
      gap: 10px;
    }
    .setting label { min-width: 180px; }
    .setting input, .setting select {
      flex: 1;
      max-width: 300px;
      background-color: var(--vscode-input-background);
      color: var(--vscode-input-foreground);
      border: 1px solid var(--vscode-input-border);
      padding: 4px 8px;
    }
    #log {
      background-color: var(--vscode-terminal-background);
      color: var(--vscode-terminal-foreground);
      padding: 10px;
      font-family: var(--vscode-editor-font-family);
      font-size: 12px;
      white-space: pre-wrap;
      min-height: 150px;
      max-height: 300px;
      overflow-y: auto;
      border: 1px solid var(--vscode-panel-border);
    }
    .hint { color: var(--vscode-descriptionForeground); font-size: 12px; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Semantic Engine</h1>

  <div class="section">
    <h2>Actions</h2>
    <button id="btn-scan">Fast Scan</button>
    <button id="btn-scan-symbols">Deep Scan</button>
    <button id="btn-tools">List AI Tools</button>
    <button id="btn-settings">Open Settings</button>
  </div>

  <div class="section">
    <h2>Quick Settings</h2>
    <div class="setting">
      <label for="embedding-enabled">Embedding enabled</label>
      <input type="checkbox" id="embedding-enabled">
    </div>
    <div class="setting">
      <label for="embedding-model">Embedding model</label>
      <input type="text" id="embedding-model">
    </div>
    <div class="setting">
      <label for="llm-enabled">LLM enabled</label>
      <input type="checkbox" id="llm-enabled">
    </div>
    <div class="setting">
      <label for="llm-provider">LLM provider</label>
      <select id="llm-provider">
        <option value="openai">OpenAI</option>
        <option value="openrouter">OpenRouter</option>
        <option value="ollama">Ollama</option>
      </select>
    </div>
    <div class="setting">
      <label for="llm-model">LLM model</label>
      <input type="text" id="llm-model">
    </div>
    <div class="setting">
      <label for="vector-backend">Vector search backend</label>
      <select id="vector-backend">
        <option value="auto">auto</option>
        <option value="brute-force">brute-force</option>
        <option value="usearch">usearch</option>
      </select>
    </div>
    <div class="setting">
      <label for="usearch-threshold">usearch threshold</label>
      <input type="number" id="usearch-threshold" min="10">
    </div>
    <button id="btn-save">Save Settings</button>
    <div class="hint">Full settings are also available via the "Open Settings" button.</div>
  </div>

  <div class="section">
    <h2>Log</h2>
    <div id="log"></div>
  </div>

  <script>
    const vscode = acquireVsCodeApi();
    const logEl = document.getElementById('log');

    function log(text) {
      const line = document.createElement('div');
      line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + text;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
    }

    document.getElementById('btn-scan').addEventListener('click', () => {
      vscode.postMessage({ command: 'scanWorkspace' });
      log('Scan workspace requested...');
    });

    document.getElementById('btn-scan-symbols').addEventListener('click', () => {
      vscode.postMessage({ command: 'scanWithSymbols' });
      log('Scan with symbols requested...');
    });

    document.getElementById('btn-tools').addEventListener('click', () => {
      vscode.postMessage({ command: 'listAiTools' });
      log('Listing AI tools...');
    });

    document.getElementById('btn-settings').addEventListener('click', () => {
      vscode.postMessage({ command: 'openSettings' });
    });

    document.getElementById('btn-save').addEventListener('click', () => {
      vscode.postMessage({ command: 'setConfig', key: 'embedding.enabled', value: document.getElementById('embedding-enabled').checked });
      vscode.postMessage({ command: 'setConfig', key: 'embedding.model', value: document.getElementById('embedding-model').value });
      vscode.postMessage({ command: 'setConfig', key: 'llm.enabled', value: document.getElementById('llm-enabled').checked });
      vscode.postMessage({ command: 'setConfig', key: 'llm.provider', value: document.getElementById('llm-provider').value });
      vscode.postMessage({ command: 'setConfig', key: 'llm.model', value: document.getElementById('llm-model').value });
      vscode.postMessage({ command: 'setConfig', key: 'vectorSearch.backend', value: document.getElementById('vector-backend').value });
      vscode.postMessage({ command: 'setConfig', key: 'vectorSearch.usearchThreshold', value: parseInt(document.getElementById('usearch-threshold').value, 10) });
      log('Settings saved.');
    });

    window.addEventListener('message', event => {
      const message = event.data;
      if (message.type === 'log') {
        log(message.text);
      } else if (message.type === 'config') {
        document.getElementById('embedding-enabled').checked = message.values.embeddingEnabled;
        document.getElementById('embedding-model').value = message.values.embeddingModel;
        document.getElementById('llm-enabled').checked = message.values.llmEnabled;
        document.getElementById('llm-provider').value = message.values.llmProvider;
        document.getElementById('llm-model').value = message.values.llmModel;
        document.getElementById('vector-backend').value = message.values.vectorSearchBackend;
        document.getElementById('usearch-threshold').value = message.values.vectorSearchUsearchThreshold;
      }
    });

    vscode.postMessage({ command: 'getConfig' });
  </script>
</body>
</html>
