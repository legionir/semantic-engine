name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 20.x is the engines floor; 22.x has the built-in node:sqlite.
        node-version: [20, 22]
    defaults:
      run:
        working-directory: semantic-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: semantic-engine/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Optional: the consumer package used by the cross-repo contract test
      # (src/ai/mcp/mcpIndexGeneration.test.ts). Read-only checkout; when the repository
      # is not readable with this token the suite skips and the recorded skip budget applies.
      - name: Checkout consumer (structured-ai)
        id: consumer
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: legionir/semantic-engine-structured-ai
          path: consumer
      # dist/ must exist: ~10 suites (gateway e2e, CLI, LSP client) run against it
      # and are silently skipped otherwise.
      - run: npm run build
      - name: Type check (tests)
        run: npx tsc -p tsconfig.test.json --noEmit
      - run: npm run lint
      - run: npm run test:gate
        env:
          STRUCTURED_AI_ROOT: ${{ steps.consumer.outcome == 'success' && format('{0}/consumer/structured-ai', github.workspace) || '' }}
          SEMANTIC_ENGINE_SKIP_BUDGET: ${{ steps.consumer.outcome == 'success' && '0' || '' }}
      - name: Jest (must not skip dist-gated suites)
        env:
          STRUCTURED_AI_ROOT: ${{ steps.consumer.outcome == 'success' && format('{0}/consumer/structured-ai', github.workspace) || '' }}
        run: |
          npx jest --ci 2>&1 | tee jest.log
          if grep -q "dist/ is not built" jest.log; then
            echo "dist-gated suites were skipped"; exit 1
          fi

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: semantic-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: semantic-engine/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Production dependencies (including optional ones) must carry no high or
      # critical advisory. Dev-tooling advisories (jest chain) are reported only.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=critical || true

  bench:
    name: Performance regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: semantic-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: semantic-engine/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      # bench/baseline.json was recorded on this runner type (run 39054351297). A metric
      # more than 35% (+50 ms for timings) above its baseline fails the job. Re-record
      # with `node scripts/bench.js --write` on a runner when an intended change moves it.
      - run: node scripts/bench.js --check | tee bench-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-result
          path: semantic-engine/bench-result.json
